name: CI

# Typechecks, tests and dry-runs the Worker deploy, and runs the page's smoke
# tests in a browser, on every pull request and on main. No `paths` filter,
# so both jobs can be required checks.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Test and dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The bridge comes from the Pointsman commit pinned in engine.json.
      - name: Fetch engine
        run: node scripts/fetch-engine.mjs

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck, test, dry-run deploy
        run: pnpm check

  # The page in a browser on the real Worker (playwright.config.ts). No
  # secrets: the Worker gets throwaway values and never reaches the broker,
  # Pointsman or GitHub.
  smoke:
    name: Smoke tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch engine
        run: node scripts/fetch-engine.mjs

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The browser version comes with @playwright/test in the lockfile.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke tests
        run: pnpm test:e2e
